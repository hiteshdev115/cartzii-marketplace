name: Deploy to QA (qa.cartzii.com)

on:
  push:
    branches:
      - feature/dev
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  APP_DIR: /home/cartziidev/cartzii-marketplace
  PM2_APP_NAME: cartzii-qa

jobs:
  build-and-deploy:
    name: Build & Deploy to QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GUEST_API_TOKEN: ${{ secrets.NEXT_PUBLIC_GUEST_API_TOKEN }}

      - name: Verify build output
        run: |
          echo "=== Build ID ==="
          cat .next/BUILD_ID
          echo ""
          echo "=== Standalone check ==="
          ls -la .next/standalone/server.js
          echo "=== Static chunks count ==="
          find .next/static -name "*.js" | wc -l
          echo "=== API endpoint in build ==="
          grep -rl "api/v1/categories" .next/static/ || echo "WARNING: API endpoints not found in static chunks"

      - name: Prepare deployment artifact
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -r .next/standalone/* deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          cp ecosystem.config.js deploy/
          echo "=== Deploy artifact contents ==="
          ls -la deploy/
          ls -la deploy/.next/

      - name: Create deployment archive
        run: |
          cd deploy && tar czf ../deploy.tar.gz .
          ls -lh deploy.tar.gz

      - name: Stop app and clean target
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "=== Current PM2 processes ==="
            pm2 list || true

            echo "=== Stopping all PM2 processes ==="
            pm2 stop all 2>/dev/null || true
            pm2 delete all 2>/dev/null || true

            echo "=== Cleaning app directory ==="
            rm -rf ${{ env.APP_DIR }}
            mkdir -p ${{ env.APP_DIR }}
            echo "=== Directory cleaned ==="
            ls -la ${{ env.APP_DIR }}

      - name: Upload deployment archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          source: "deploy.tar.gz"
          target: ${{ env.APP_DIR }}

      - name: Extract and start application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ${{ env.APP_DIR }}

            echo "=== Files before extraction ==="
            ls -la

            tar xzf deploy.tar.gz
            rm -f deploy.tar.gz

            echo "=== Files after extraction ==="
            ls -la
            echo "=== Build ID ==="
            cat .next/BUILD_ID || echo "ERROR: No BUILD_ID found"

            command -v pm2 >/dev/null 2>&1 || npm install -g pm2

            echo "=== Starting PM2 ==="
            pm2 start ecosystem.config.js
            sleep 2
            pm2 list
            echo "=== PM2 logs (last 20 lines) ==="
            pm2 logs ${{ env.PM2_APP_NAME }} --nostream --lines 20 || true

            pm2 save
            echo "=== Deployment complete ==="
