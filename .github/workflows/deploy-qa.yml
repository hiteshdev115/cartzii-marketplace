name: Deploy to QA (qa.cartzii.com)

on:
  push:
    branches:
      - feature/dev
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  APP_DIR: /home/cartziidev/cartzii-marketplace
  PM2_APP_NAME: cartzii-qa

jobs:
  build-and-deploy:
    name: Build & Deploy to QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy
          # Copy standalone server
          cp -r .next/standalone/* deploy/
          # Copy static assets
          cp -r .next/static deploy/.next/static
          # Copy public assets
          cp -r public deploy/public
          # Copy PM2 ecosystem config
          cp ecosystem.config.js deploy/

      - name: Deploy to QA server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          source: "deploy/*"
          target: ${{ env.APP_DIR }}
          strip_components: 1
          overwrite: true

      - name: Restart application on QA server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ${{ env.APP_DIR }}

            # Install PM2 globally if not present
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2

            # Stop existing app if running, then start fresh
            pm2 stop ${{ env.PM2_APP_NAME }} 2>/dev/null || true
            pm2 delete ${{ env.PM2_APP_NAME }} 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "Deployment to qa.cartzii.com complete!"
