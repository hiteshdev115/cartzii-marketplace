name: Deploy to QA (qa.cartzii.com)

on:
  push:
    branches:
      - feature/dev
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  APP_DIR: /home/cartziidev/cartzii-marketplace
  PM2_APP_NAME: cartzii-qa

jobs:
  build-and-deploy:
    name: Build & Deploy to QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GUEST_API_TOKEN: ${{ secrets.NEXT_PUBLIC_GUEST_API_TOKEN }}

      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy/.next
          # Copy standalone server
          cp -r .next/standalone/* deploy/
          # Copy static assets
          cp -r .next/static deploy/.next/static
          # Copy public assets
          cp -r public deploy/public
          # Copy PM2 ecosystem config
          cp ecosystem.config.js deploy/

      - name: Create deployment archive
        run: cd deploy && tar czf ../deploy.tar.gz .

      - name: Deploy to QA server via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Stop app and clean target
            pm2 stop ${{ env.PM2_APP_NAME }} 2>/dev/null || true
            pm2 delete ${{ env.PM2_APP_NAME }} 2>/dev/null || true
            chmod -R u+rwx ${{ env.APP_DIR }} 2>/dev/null || true
            rm -rf ${{ env.APP_DIR }}
            mkdir -p ${{ env.APP_DIR }}

      - name: Upload deployment archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Extract and start application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USERNAME }}
          password: ${{ secrets.QA_SSH_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ${{ env.APP_DIR }}
            tar xzf /tmp/deploy.tar.gz
            rm -f /tmp/deploy.tar.gz

            # Install PM2 globally if not present
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2

            pm2 start ecosystem.config.js
            pm2 save

            echo "Deployment to qa.cartzii.com complete!"
